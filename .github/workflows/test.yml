# .github/workflows/test.yml
name: Python Test and Coverage with TestSuite

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  workflow_dispatch:

jobs:
  test-with-coverage:
    name: Run tests with Python 3.14 and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    services:
      redis:
        image: redis:8.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-3.8.txt
          requirements-dev-3.8.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install codecov build

        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

    - name: Run tests with coverage
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/ -n 8 --dist=loadgroup --cov=rhosocial --cov-branch --cov-report=xml

    - name: SQLite expression-dialect coverage gate
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        # dialect/expression/mixins is the layer whose output is SQL text:
        # every branch is a spelling, and an untested one is a spelling nobody
        # checked. Hold it at 100% line+branch; the rest of the backend is not
        # gated. This writes no coverage.xml, so the report above is untouched.
        export PYTHONPATH=src:tests
        python -m pytest tests/rhosocial/activerecord_test/feature/backend/sqlite \
          -q -p no:warnings \
          --cov=rhosocial.activerecord.backend.impl.sqlite.dialect \
          --cov=rhosocial.activerecord.backend.impl.sqlite.expression \
          --cov=rhosocial.activerecord.backend.impl.sqlite.mixins \
          --cov-branch --cov-fail-under=100 --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests,python-3.14
        name: codecov-umbrella-3.14
        fail_ci_if_error: false

  benchmark-python-315:
    name: Run benchmarks with Python 3.15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.15
      uses: actions/setup-python@v6
      with:
        python-version: "3.15"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-3.8.txt
          requirements-dev-3.8.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

    - name: Run benchmark suite
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        set -o pipefail
        export PYTHONPATH=src:tests
        TESTSUITE_DIR=$(python - <<'PY'
        import pathlib
        import rhosocial.activerecord.testsuite as testsuite

        print(pathlib.Path(testsuite.__file__).parent)
        PY
        )
        python -m pytest \
          tests/benchmark/relation/ \
          -m benchmark_relation \
          --benchmark-sort=mean \
          --tb=short | tee -a benchmark-output.txt
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          "$TESTSUITE_DIR/benchmark/crud/core/test_delete_async.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_delete.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_insert_async.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_insert.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_query_async.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_query.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_update_async.py" \
          "$TESTSUITE_DIR/benchmark/crud/core/test_update.py" \
          "$TESTSUITE_DIR/benchmark/query" \
          "$TESTSUITE_DIR/benchmark/transaction" \
          "$TESTSUITE_DIR/benchmark/mixin" \
          -m benchmark \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee -a benchmark-output.txt
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          tests/benchmark/activerecord_bulk \
          -m benchmark \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee -a benchmark-output.txt
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          tests/benchmark/backend \
          -m benchmark \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee -a benchmark-output.txt

    - name: Run FastAPI benchmark suite
      run: |
        set -o pipefail
        export PYTHONPATH=src:tests
        TESTSUITE_DIR=$(python - <<'PY'
        import pathlib
        import rhosocial.activerecord.testsuite as testsuite

        print(pathlib.Path(testsuite.__file__).parent)
        PY
        )
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          "$TESTSUITE_DIR/benchmark/fastapi" \
          -m benchmark_fastapi \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee fastapi-benchmark-output.txt

    - name: Write benchmark conclusion
      if: always()
      run: |
        {
          echo "## Python 3.15 Benchmark Conclusion"
          echo
          echo "- Python: 3.15"
          echo "- Scope: testsuite generic benchmarks + SQLite backend direct benchmarks"
          echo "- Size: small"
          echo "- Result: benchmark job fails only when benchmark execution or correctness checks fail."
          echo
          echo '```text'
          grep -A 120 "benchmark:" benchmark-output.txt || cat benchmark-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Write FastAPI benchmark conclusion
      if: always()
      run: |
        {
          echo "## Python 3.15 FastAPI Benchmark Conclusion"
          echo
          echo "- Python: 3.15"
          echo "- Scope: testsuite FastAPI database benchmarks"
          echo "- Size: small"
          echo "- Result: benchmark job fails only when FastAPI benchmark execution or correctness checks fail."
          echo
          echo '```text'
          grep -A 120 "benchmark:" fastapi-benchmark-output.txt || cat fastapi-benchmark-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  test-other-versions:
    name: Run tests with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            redis-version: "6.2"
            os: ubuntu-22.04
          - python-version: "3.9"
            redis-version: "7.0"
            os: ubuntu-22.04
          - python-version: "3.10"
            redis-version: "7.2"
            os: ubuntu-latest
          - python-version: "3.11"
            redis-version: "7.4"
            os: ubuntu-latest
          - python-version: "3.12"
            redis-version: "8.0"
            os: ubuntu-latest
          - python-version: "3.13"
            redis-version: "8.2"
            os: ubuntu-latest

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-3.8.txt
          requirements-dev-3.8.txt

    - name: Install dependencies
      run: |
        if [ "${{ matrix.python-version }}" == "3.8" ]; then
          pip install -r requirements-3.8.txt
          pip install -r requirements-dev-3.8.txt
        else
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        fi

        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

    - name: Run tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/ -n 8 --dist=loadgroup

  test-free-threaded:
    name: Run tests with Python ${{ matrix.python-version }} free-threaded
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      matrix:
        include:
          - python-version: "3.13t"
            redis-version: "8.4"
          - python-version: "3.14t"
            redis-version: "8.6"

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-3.8.txt
          requirements-dev-3.8.txt

    - name: Install dependencies
      run: |
        if [ "${{ matrix.python-version }}" == "3.8" ]; then
          pip install -r requirements-3.8.txt
          pip install -r requirements-dev-3.8.txt
        else
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        fi

        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

    - name: Run tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/ -n 8 --dist=loadgroup

  test-python-315:
    name: Run tests with Python ${{ matrix.python-version }}${{ matrix.freethreaded && 't free-threaded' || '' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - python-version: "3.15"
            redis-version: "8.8"
            freethreaded: false
          - python-version: "3.15"
            redis-version: "8.8"
            freethreaded: true

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}${{ matrix.freethreaded && ' free-threaded' || '' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        freethreaded: ${{ matrix.freethreaded }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-3.8.txt
          requirements-dev-3.8.txt

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install "rhosocial-activerecord-testsuite @ git+https://github.com/rhosocial/python-activerecord-testsuite.git@feature/activerecord-ddl"

    - name: Run tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        REDIS_DB: 0
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/ -n 8 --dist=loadgroup
