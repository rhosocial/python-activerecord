# .github/workflows/test.yml
name: Python Test and Coverage with TestSuite

on:
  push:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'
  pull_request:
    branches:
      - main
      - 'release/v**'
      - 'maint/**'

jobs:
  test-with-coverage:
    name: Run tests with Python 3.14 and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install codecov build

        pip install git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev15#egg=rhosocial-activerecord-testsuite

    - name: Run tests with coverage
      run: |
        export PYTHONPATH=src:tests
        coverage run -m pytest tests/
        coverage xml
        coverage report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests,python-3.14
        name: codecov-umbrella-3.14
        fail_ci_if_error: false

  benchmark-python-314:
    name: Run benchmarks with Python 3.14
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

        pip install git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev15#egg=rhosocial-activerecord-testsuite

    - name: Run benchmark suite
      run: |
        set -o pipefail
        export PYTHONPATH=src:tests
        TESTSUITE_DIR=$(python - <<'PY'
        import pathlib
        import rhosocial.activerecord.testsuite as testsuite

        print(pathlib.Path(testsuite.__file__).parent)
        PY
        )
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          "$TESTSUITE_DIR/benchmark/crud" \
          "$TESTSUITE_DIR/benchmark/query" \
          "$TESTSUITE_DIR/benchmark/transaction" \
          "$TESTSUITE_DIR/benchmark/mixin" \
          -m benchmark \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee benchmark-output.txt
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          tests/benchmark/crud \
          tests/benchmark/backend \
          -m benchmark \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee -a benchmark-output.txt

    - name: Run FastAPI benchmark suite
      run: |
        set -o pipefail
        export PYTHONPATH=src:tests
        TESTSUITE_DIR=$(python - <<'PY'
        import pathlib
        import rhosocial.activerecord.testsuite as testsuite

        print(pathlib.Path(testsuite.__file__).parent)
        PY
        )
        python -m pytest \
          --rootdir=. \
          --confcutdir=. \
          "$TESTSUITE_DIR/benchmark/fastapi" \
          -m benchmark_fastapi \
          --benchmark-size=small \
          --benchmark-sort=mean \
          --tb=short | tee fastapi-benchmark-output.txt

    - name: Write benchmark conclusion
      if: always()
      run: |
        {
          echo "## Python 3.14 Benchmark Conclusion"
          echo
          echo "- Python: 3.14"
          echo "- Scope: testsuite generic benchmarks + SQLite backend direct benchmarks"
          echo "- Size: small"
          echo "- Result: benchmark job fails only when benchmark execution or correctness checks fail."
          echo
          echo '```text'
          grep -A 120 "benchmark:" benchmark-output.txt || cat benchmark-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Write FastAPI benchmark conclusion
      if: always()
      run: |
        {
          echo "## Python 3.14 FastAPI Benchmark Conclusion"
          echo
          echo "- Python: 3.14"
          echo "- Scope: testsuite FastAPI database benchmarks"
          echo "- Size: small"
          echo "- Result: benchmark job fails only when FastAPI benchmark execution or correctness checks fail."
          echo
          echo '```text'
          grep -A 120 "benchmark:" fastapi-benchmark-output.txt || cat fastapi-benchmark-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  test-other-versions:
    name: Run tests with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        if [ "${{ matrix.python-version }}" == "3.8" ]; then
          pip install -r requirements-3.8.txt
          pip install -r requirements-dev-3.8.txt
        else
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        fi

        pip install git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev15#egg=rhosocial-activerecord-testsuite

    - name: Run tests
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/

  test-free-threaded:
    name: Run tests with Python ${{ matrix.python-version }} free-threaded
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13t", "3.14t"]

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        if [ "${{ matrix.python-version }}" == "3.8" ]; then
          pip install -r requirements-3.8.txt
          pip install -r requirements-dev-3.8.txt
        else
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
        fi

        pip install git+https://github.com/rhosocial/python-activerecord-testsuite.git@release/v1.0.0.dev15#egg=rhosocial-activerecord-testsuite

    - name: Run tests
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/

