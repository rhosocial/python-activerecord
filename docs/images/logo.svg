<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="rhosocial activerecord">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F52D0"/>
      <stop offset="1" stop-color="#8A3FFC"/>
    </linearGradient>
  </defs>

  <!-- rounded-square canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- six symmetric ecosystem nodes linked to the core (no labels) -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round">
    <path d="M256 256 L256 92"/>
    <path d="M256 256 L402 174"/>
    <path d="M256 256 L402 338"/>
    <path d="M256 256 L256 420"/>
    <path d="M256 256 L110 338"/>
    <path d="M256 256 L110 174"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.9">
    <circle cx="256" cy="92" r="13"/>
    <circle cx="402" cy="174" r="13"/>
    <circle cx="402" cy="338" r="13"/>
    <circle cx="256" cy="420" r="13"/>
    <circle cx="110" cy="338" r="13"/>
    <circle cx="110" cy="174" r="13"/>
  </g>

  <!-- geometric lowercase rho: a bowl (ring) + a descender stroke through it -->
  <circle cx="256" cy="232" r="58" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <path d="M256 174 L256 372" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
</svg>
